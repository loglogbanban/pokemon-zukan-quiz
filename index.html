<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケモン全国図鑑番号当てクイズ</title>
  <style>
    :root {
      --primary: #e63946;
      --secondary: #457b9d;
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #1d3557;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 520px;
      width: 100%;
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin-top: 0;
      color: var(--primary);
    }
    .filter-box {
      background: #f1faee;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      font-weight: bold;
    }
    select, input[type="number"], button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      margin-top: 4px;
    }
    .filter-apply-btn {
      grid-column: span 2;
      background: var(--secondary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .quiz-area {
      text-align: center;
    }
    .pokemon-img-wrap {
      width: 160px;
      height: 160px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f3f5;
      border-radius: 50%;
    }
    .pokemon-img {
      width: 140px;
      height: 140px;
      object-fit: contain;
    }
    .pokemon-name {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 12px 0;
    }
    .hints-area {
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hint-btns {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .btn-hint {
      background: #ffb703;
      color: #000;
      border: none;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      flex: 1;
    }
    .btn-hint:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .hint-box {
      background: #fff3cd;
      border: 1px solid #ffe69c;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
      text-align: left;
    }
    .answer-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .answer-group input {
      flex: 1;
      margin-top: 0;
      text-align: center;
      font-size: 1.1rem;
    }
    .btn-submit {
      background: var(--primary);
      color: #fff;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0;
      padding: 0 20px;
    }
    .result-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: #e9ecef;
      display: none;
    }
    .diff-highlight {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary);
    }
    .btn-next {
      width: 100%;
      background: #2a9d8f;
      color: #fff;
      border: none;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
    }
    .stats-bar {
      margin-top: 16px;
      font-size: 0.85rem;
      text-align: center;
      color: #555;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>ポケモン図鑑番号当てクイズ</h1>

  <!-- フィルター設定 -->
  <div class="filter-box">
    <div class="filter-group">
      <label for="regionSelect">地方フィルター</label>
      <select id="regionSelect"></select>
    </div>
    <div class="filter-group">
      <label for="typeSelect">タイプフィルター</label>
      <select id="typeSelect"></select>
    </div>
    <button class="filter-apply-btn" id="applyFilterBtn">この条件で出題する</button>
  </div>

  <!-- 出題エリア -->
  <div class="quiz-area">
    <div class="pokemon-img-wrap">
      <img id="pokemonImg" class="pokemon-img" src="" alt="pokemon" style="display:none;">
      <span id="loadingText">読み込み中...</span>
    </div>
    <div class="pokemon-name" id="pokemonName">---</div>

    <!-- ヒント機能 -->
    <div class="hints-area">
      <div class="hint-btns">
        <button class="btn-hint" id="hintTypeBtn">ヒント1: タイプを見る</button>
        <button class="btn-hint" id="hintEvoBtn">ヒント2: 進化情報を見る</button>
      </div>
      <div class="hint-box" id="hintTypeBox"></div>
      <div class="hint-box" id="hintEvoBox"></div>
    </div>

    <!-- 解答入力 -->
    <div class="answer-group">
      <input type="number" id="guessInput" placeholder="図鑑番号 (1〜1025)" min="1" max="1025">
      <button class="btn-submit" id="submitBtn">解答する</button>
    </div>

    <!-- 結果表示 -->
    <div class="result-box" id="resultBox">
      <div id="resultText"></div>
      <button class="btn-next" id="nextBtn">次の問題へ</button>
    </div>
  </div>

  <!-- スコア統計 -->
  <div class="stats-bar" id="statsBar">
    プレイ回数: 0回 | 平均誤差: ---
  </div>
</div>

<script>
/**
 * ==========================================
 * 1. 拡張用マスター設定 (JSON互換オブジェクト)
 * 後から外部JSONファイル(config.json等)に切り出したり、
 * 項目を追加して機能を拡張しやすい構造にしています。
 * ==========================================
 */
const APP_CONFIG = {
  regions: [
    { id: "all", name: "すべて (1〜1025)", min: 1, max: 1025 },
    { id: "kanto", name: "カントー (1〜151)", min: 1, max: 151 },
    { id: "johto", name: "ジョウト (152〜251)", min: 152, max: 251 },
    { id: "hoenn", name: "ホウエン (252〜386)", min: 252, max: 386 },
    { id: "sinnoh", name: "シンオウ (387〜493)", min: 387, max: 493 },
    { id: "unova", name: "イッシュ (494〜649)", min: 494, max: 649 },
    { id: "kalos", name: "カロス (650〜721)", min: 650, max: 721 },
    { id: "alola", name: "アローラ (722〜809)", min: 722, max: 809 },
    { id: "galar", name: "ガラル・ヒスイ (810〜905)", min: 810, max: 905 },
    { id: "paldea", name: "パルデア (906〜1025)", min: 906, max: 1025 }
  ],
  types: [
    { id: "all", ja: "すべて" },
    { id: "normal", ja: "ノーマル" }, { id: "fire", ja: "ほのお" },
    { id: "water", ja: "みず" }, { id: "grass", ja: "くさ" },
    { id: "electric", ja: "でんき" }, { id: "ice", ja: "こおり" },
    { id: "fighting", ja: "かくとう" }, { id: "poison", ja: "どく" },
    { id: "ground", ja: "じめん" }, { id: "flying", ja: "ひこう" },
    { id: "psychic", ja: "エスパー" }, { id: "bug", ja: "むし" },
    { id: "rock", ja: "いわ" }, { id: "ghost", ja: "ゴースト" },
    { id: "dragon", ja: "ドラゴン" }, { id: "dark", ja: "あく" },
    { id: "steel", ja: "はがね" }, { id: "fairy", ja: "フェアリー" }
  ],
  // 将来的に独自のヒントやメモを追加できるカスタム辞書
  customData: {}
};

// 状態管理
let candidateIds = [];
let currentPokemon = null;
let playCount = 0;
let totalDiff = 0;
const typeCache = {}; // タイプ別IDリストのキャッシュ

// DOM要素
const regionSelect = document.getElementById("regionSelect");
const typeSelect = document.getElementById("typeSelect");
const applyFilterBtn = document.getElementById("applyFilterBtn");
const pokemonImg = document.getElementById("pokemonImg");
const loadingText = document.getElementById("loadingText");
const pokemonName = document.getElementById("pokemonName");
const hintTypeBtn = document.getElementById("hintTypeBtn");
const hintEvoBtn = document.getElementById("hintEvoBtn");
const hintTypeBox = document.getElementById("hintTypeBox");
const hintEvoBox = document.getElementById("hintEvoBox");
const guessInput = document.getElementById("guessInput");
const submitBtn = document.getElementById("submitBtn");
const resultBox = document.getElementById("resultBox");
const resultText = document.getElementById("resultText");
const nextBtn = document.getElementById("nextBtn");
const statsBar = document.getElementById("statsBar");

// 初期化
function init() {
  APP_CONFIG.regions.forEach(r => {
    const opt = document.createElement("option");
    opt.value = r.id;
    opt.textContent = r.name;
    regionSelect.appendChild(opt);
  });
  APP_CONFIG.types.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t.id;
    opt.textContent = t.ja;
    typeSelect.appendChild(opt);
  });

  applyFilterBtn.addEventListener("click", updateCandidatesAndLoad);
  hintTypeBtn.addEventListener("click", showTypeHint);
  hintEvoBtn.addEventListener("click", showEvoHint);
  submitBtn.addEventListener("click", checkAnswer);
  nextBtn.addEventListener("click", loadNextQuestion);
  guessInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !submitBtn.disabled) checkAnswer();
  });

  updateCandidatesAndLoad();
}

// フィルター条件から出題候補IDリストを作成
async function updateCandidatesAndLoad() {
  setLoadingState(true, "フィルター適用中...");
  const regionId = regionSelect.value;
  const typeId = typeSelect.value;
  const region = APP_CONFIG.regions.find(r => r.id === regionId);

  let rangeIds = [];
  for (let i = region.min; i <= region.max; i++) rangeIds.push(i);

  if (typeId === "all") {
    candidateIds = rangeIds;
  } else {
    if (!typeCache[typeId]) {
      const res = await fetch(`https://pokeapi.co/api/v2/type/${typeId}`);
      const data = await res.json();
      // URLから全国図鑑番号(1〜1025)を抽出
      typeCache[typeId] = data.pokemon
        .map(p => Number(p.pokemon.url.split("/").filter(Boolean).pop()))
        .filter(id => id >= 1 && id <= 1025);
    }
    const typeSet = new Set(typeCache[typeId]);
    candidateIds = rangeIds.filter(id => typeSet.has(id));
  }

  if (candidateIds.length === 0) {
    setLoadingState(true, "該当するポケモンがいません。条件を変えてください。");
    return;
  }

  await loadNextQuestion();
}

// 次の問題を出題
async function loadNextQuestion() {
  setLoadingState(true, "ポケモンを探しています...");
  resetQuestionUI();

  const randomId = candidateIds[Math.floor(Math.random() * candidateIds.length)];

  try {
    currentPokemon = await fetchPokemonData(randomId);
    pokemonImg.src = currentPokemon.image;
    pokemonImg.style.display = "block";
    loadingText.style.display = "none";
    pokemonName.textContent = currentPokemon.nameJa;
    submitBtn.disabled = false;
    guessInput.focus();
  } catch (err) {
    setLoadingState(true, "通信エラーが発生しました。再試行してください。");
  }
}

/**
 * ==========================================
 * 2. PokeAPI データ取得＆拡張用モジュール
 * 後から身長・体重・特性・鳴き声・図鑑説明文などを
 * 追加したい場合は、この関数の return に足すだけで拡張可能です。
 * ==========================================
 */
async function fetchPokemonData(id) {
  const [pokeRes, speciesRes] = await Promise.all([
    fetch(`https://pokeapi.co/api/v2/pokemon/${id}`),
    fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`)
  ]);
  const pokeData = await pokeRes.json();
  const speciesData = await speciesRes.json();

  // 日本語名取得
  const jaNameObj = speciesData.names.find(n => n.language.name === "ja-Hrkt" || n.language.name === "ja");
  const nameJa = jaNameObj ? jaNameObj.name : pokeData.name;

  // タイプ日本語変換
  const typesJa = pokeData.types.map(t => {
    const found = APP_CONFIG.types.find(item => item.id === t.type.name);
    return found ? found.ja : t.type.name;
  });

  // 地方判定
  const regionObj = APP_CONFIG.regions.find(r => r.id !== "all" && id >= r.min && id <= r.max);

  return {
    id: pokeData.id,
    nameJa: nameJa,
    image: pokeData.sprites.other["official-artwork"].front_default || pokeData.sprites.front_default,
    typesJa: typesJa,
    regionName: regionObj ? regionObj.name.split(" ")[0] : "不明",
    evolutionChainUrl: speciesData.evolution_chain ? speciesData.evolution_chain.url : null,
    evoHintText: null, // ヒント2ボタン押下時に遅延取得してキャッシュ
    // 将来の拡張用データ枠
    rawPoke: pokeData,
    rawSpecies: speciesData,
    custom: APP_CONFIG.customData[id] || {}
  };
}

// ヒント1: タイプ表示
function showTypeHint() {
  if (!currentPokemon) return;
  hintTypeBox.textContent = `タイプ: ${currentPokemon.typesJa.join(" / ")}`;
  hintTypeBox.style.display = "block";
  hintTypeBtn.disabled = true;
}

// ヒント2: 進化段階・進化有無を解析して表示
async function showEvoHint() {
  if (!currentPokemon) return;
  hintEvoBtn.disabled = true;
  hintEvoBox.style.display = "block";

  if (currentPokemon.evoHintText) {
    hintEvoBox.textContent = currentPokemon.evoHintText;
    return;
  }

  hintEvoBox.textContent = "進化情報を解析中...";
  try {
    const res = await fetch(currentPokemon.evolutionChainUrl);
    const evoData = await res.json();
    const info = analyzeEvolutionChain(evoData.chain, currentPokemon.id);
    currentPokemon.evoHintText = info;
    hintEvoBox.textContent = info;
  } catch (e) {
    hintEvoBox.textContent = "進化情報の取得に失敗しました";
  }
}

// 進化チェーンツリーを探索して何段階目・進化有無かを判定
function analyzeEvolutionChain(chainNode, targetId) {
  function extractId(url) {
    return Number(url.split("/").filter(Boolean).pop());
  }

  // 再帰探索: [現在の段階(1始まり), さらに進化先があるか, チェーン全体で進化が存在するか]
  const totalHasEvolution = chainNode.evolves_to && chainNode.evolves_to.length > 0;
  if (!totalHasEvolution) {
    return "進化情報: 進化しないポケモン（単体）";
  }

  let resultText = "進化情報: 不明";
  function dfs(node, stage) {
    const nodeId = extractId(node.species.url);
    const hasNext = node.evolves_to && node.evolves_to.length > 0;
    if (nodeId === targetId) {
      if (stage === 1) {
        resultText = `進化情報: たね / 1段階目（さらに進化する）`;
      } else if (hasNext) {
        resultText = `進化情報: ${stage}段階目の進化ポケモン（さらに進化する）`;
      } else {
        resultText = `進化情報: ${stage}段階目の進化ポケモン（最終進化）`;
      }
      return true;
    }
    for (const nextNode of node.evolves_to) {
      if (dfs(nextNode, stage + 1)) return true;
    }
    return false;
  }

  dfs(chainNode, 1);
  return resultText;
}

// 解答チェックと誤差計算
function checkAnswer() {
  if (!currentPokemon) return;
  const guess = parseInt(guessInput.value, 10);
  if (isNaN(guess) || guess < 1 || guess > 1025) {
    alert("1〜1025の数値を入力してください！");
    return;
  }

  submitBtn.disabled = true;
  const actual = currentPokemon.id;
  const diff = Math.abs(actual - guess);

  playCount++;
  totalDiff += diff;
  const avgDiff = (totalDiff / playCount).toFixed(1);
  statsBar.textContent = `プレイ回数: ${playCount}回 | 平均誤差: ±${avgDiff}`;

  let comment = "";
  if (diff === 0) comment = "🎉 ピッタリ大正解！！素晴らしい知識です！";
  else if (diff <= 5) comment = "🔥 惜しい！ほぼピッタリです！";
  else if (diff <= 20) comment = "✨ かなり近いです！";
  else if (diff <= 50) comment = "👍 そこそこ近いです！";
  else comment = "💡 次はヒントも活用してみましょう！";

  resultText.innerHTML = `
    <div>あなたの解答: <strong>No.${guess}</strong> / 正解: <strong>No.${actual}</strong> (${currentPokemon.regionName})</div>
    <div style="margin: 8px 0;">番号誤差: <span class="diff-highlight">±${diff}</span></div>
    <div>${comment}</div>
  `;
  resultBox.style.display = "block";
}

function resetQuestionUI() {
  guessInput.value = "";
  resultBox.style.display = "none";
  hintTypeBox.style.display = "none";
  hintEvoBox.style.display = "none";
  hintTypeBtn.disabled = false;
  hintEvoBtn.disabled = false;
  submitBtn.disabled = true;
}

function setLoadingState(isLoading, text = "") {
  if (isLoading) {
    pokemonImg.style.display = "none";
    loadingText.style.display = "inline";
    loadingText.textContent = text;
    pokemonName.textContent = "---";
  }
}

init();
</script>
</body>
</html>
